<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Cross-Venture Deal Guardian — private ingestion, blinded cloud graph, encrypted phone sync, offline deterministic margin checks."
    />
    <title>Cross-Venture Deal Guardian</title>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>

    <header class="topbar">
      <div class="topbar-in">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">◧</span>
          <div class="brand-text">
            <strong>Cross-Venture Deal Guardian</strong>
            <span class="brand-sub">Private ingestion · blinded cloud graph · offline verdicts</span>
          </div>
        </div>
        <div class="chips" aria-label="Runtime status">
          <span class="chip chip--muted" id="chipDevice" title="Checking on-device model…">ON-DEVICE: checking…</span>
          <span class="chip chip--muted" id="chipNet">NETWORK: …</span>
        </div>
      </div>
    </header>

    <div class="banner banner--offline" id="bannerOffline" hidden>
      <strong>You are offline.</strong>
      Ingestion, redaction and the margin engine keep running locally. Cloud graph synthesis
      and phone sync will resume once you reconnect.
    </div>

    <div class="wrap">
      <nav class="tabs" role="tablist" aria-label="Workspace sections">
        <button class="tab" role="tab" id="tabbtn-ingest" data-tab="ingest" aria-controls="tab-ingest">Ingest</button>
        <button class="tab" role="tab" id="tabbtn-inspector" data-tab="inspector" aria-controls="tab-inspector">Privacy Inspector</button>
        <button class="tab" role="tab" id="tabbtn-sync" data-tab="sync" aria-controls="tab-sync">Phone Sync</button>
        <button class="tab" role="tab" id="tabbtn-simulator" data-tab="simulator" aria-controls="tab-simulator">Deal Simulator</button>
      </nav>

      <main id="main">
        <section class="panel" id="tab-ingest" role="tabpanel" aria-labelledby="tabbtn-ingest" tabindex="0"></section>
        <section class="panel" id="tab-inspector" role="tabpanel" aria-labelledby="tabbtn-inspector" tabindex="0" hidden></section>
        <section class="panel" id="tab-sync" role="tabpanel" aria-labelledby="tabbtn-sync" tabindex="0" hidden></section>
        <section class="panel" id="tab-simulator" role="tabpanel" aria-labelledby="tabbtn-simulator" tabindex="0" hidden></section>
      </main>
    </div>

    <div class="toasts" id="toasts" role="status" aria-live="polite"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
